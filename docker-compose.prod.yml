services:
  mongo:
    image: mongo:6
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
      - MONGO_APP_USER=${MONGO_APP_USER}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    command: ["mongod", "--auth"]
  app:
    image: philipid3s/gold-bars-exchange-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "22"
        NEXT_PUBLIC_RPC_URL: "${NEXT_PUBLIC_RPC_URL:-https://rpc-amoy.polygon.technology/}"
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_INITDB_DATABASE}
      # Runtime only. The image build does not receive this value.
      - API_KEY=${API_KEY}
    depends_on:
      - mongo
volumes:
  mongo-data:
