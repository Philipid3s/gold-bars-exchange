services:
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  app:
    image: philipid3s/gold-bars-exchange-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/gold-bars
      - API_KEY=${API_KEY:-change-me}
    depends_on:
      - mongo
volumes:
  mongo-data:
