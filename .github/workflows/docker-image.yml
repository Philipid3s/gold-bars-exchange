name: Docker Image CI

on:
  push:
    branches: [ "master" ]

env:
  DOCKERHUB_USERNAME: philipid3s
  NODE_VERSION: "22"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            NEXT_PUBLIC_RPC_URL=${{ secrets.NEXT_PUBLIC_RPC_URL || 'https://rpc-amoy.polygon.technology/' }}
          tags: |
            philipid3s/gold-bars-exchange-app:latest
            philipid3s/gold-bars-exchange-app:${{ github.sha }}
